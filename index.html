function render(){const availableCategories=[...new Set(foods().filter(f=>f.meals.includes(data.meal)).map(f=>f.category))];if(data.category!=='全部'&&!availableCategories.includes(data.category)){data.category='全部';save()}chipGroup('#mealChips',MEALS,data.meal,v=>data.meal=v);chipGroup('#categoryChips',['全部',...availableCategories],data.category,v=>data.category=v);$('#budget').value=data.budget;$('#avoidRecent').checked=data.avoidRecent;$('#reduceMotion').checked=data.reduceMotion;$('#area').value=data.area;$('#excludeSummary').textContent=`已排除 ${data.excluded.length} 種料理`;$('#stats').textContent=`🍱 已確認 ${data.history.length} 餐 · 🥗 自訂 ${data.custom.length} 道料理`;refreshWheel()}
function confetti(){if(data.reduceMotion||(typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;for(let i=0;i<34;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=COLORS[i%COLORS.length];e.style.setProperty('--drift',(Math.random()*180-90)+'px');e.style.animationDelay=(Math.random()*.4)+'s';document.body.append(e);setTimeout(()=>e.remove(),2400)}}
function spin(){if(spinning)return;const pool=candidates();if(!pool.length){toast('目前沒有符合條件的料理');return}wheelItems=pool;drawGrid();const chosen=Math.floor(Math.random()*pool.length);current=pool[chosen];spinning=true;$('#spinBtn').disabled=true;$('#retryBtn').disabled=true;closeResult();$('#status').textContent='✨ 亮燈正在尋找今天的美食…';const reduced=data.reduceMotion||(typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);function finish(){highlightTile(chosen,true);spinning=false;$('#spinBtn').disabled=false;$('#retryBtn').disabled=false;$('#status').textContent='🎊 美食揭曉！';$('#resultEmoji').textContent=current.emoji;$('#resultName').textContent=current.name;$('#resultMeta').textContent=`${current.category} · 參考價格 NT$ ${current.min}–${current.max}`;$('#confirmBtn').disabled=false;openResult();confetti()}if(reduced){highlightTile(chosen,true);setTimeout(finish,60);return}const n=pool.length;let index=Math.floor(Math.random()*n);const steps=n*3+((chosen-index+n)%n)+1;let step=0;function tick(){highlightTile(index);step++;if(step>=steps){finish();return}index=(index+1)%n;const progress=step/steps;const delay=progress<.65?55:55+Math.pow((progress-.65)/.35,2)*360;setTimeout(tick,delay)}tick()}
function confirmFood(){if(!current)return;data.history.unshift({id:'h-'+Date.now()+'-'+Math.random().toString(36).slice(2),foodId:current.id,name:current.name,meal:data.meal,time:new Date().toISOString()});save();$('#confirmBtn').disabled=true;toast('❤️ 已記錄這一餐，祝你用餐愉快！');$('#stats').textContent=`🍱 已確認 ${data.history.length} 餐 · 🥗 自訂 ${data.custom.length} 道料理`}
function maps(){if(!current){toast('請先轉出一道料理');return}const query=[data.area.trim(),current.query||current.name].filter(Boolean).join(' ');let url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query);if(geo&&!data.area.trim())url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(current.query||current.name)+'&center='+encodeURIComponent(geo.lat+','+geo.lng);window.open(url,'_blank','noopener,noreferrer')}
function modal(title,body,onReady){modalReturn=document.activeElement;const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${safe(title)}</h2><button class="btn" id="closeModal" aria-label="關閉視窗">✕</button></div><div id="modalBody">${body}</div></div></div>`;const close=()=>{root.replaceChildren();modalReturn&&modalReturn.focus()};$('#closeModal').onclick=close;root.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))close()});root.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const nodes=[...root.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};$('#closeModal').focus();onReady&&onReady(close)}
function exclusions(){const body=`<p class="small">勾選不想抽到的料理。排除清單會儲存在本機。</p><div id="exclusionList" style="max-height:55vh;overflow:auto"></div><button class="btn secondary" id="clearExclusions">清空排除</button>`;modal('🚫 排除料理',body);const list=$('#exclusionList');for(const f of foods()){const label=document.createElement('label');label.className='check';const inp=document.createElement('input');inp.type='checkbox';inp.checked=data.excluded.includes(f.id);inp.onchange=()=>{data.excluded=inp.checked?[...new Set([...data.excluded,f.id])]:data.excluded.filter(x=>x!==f.id);save();render()};label.append(inp,document.createTextNode(`${f.emoji} ${f.name} · ${f.category}`));list.append(label)}$('#clearExclusions').onclick=()=>{data.excluded=[];save();render();exclusions()}}
function historyModal(){modal('📖 用餐歷史',`<div id="historyList"></div><button class="btn" id="clearHistory">🗑️ 清除全部歷史</button>`);const list=$('#historyList');if(!data.history.length)list.textContent='還沒有歷史紀錄，先轉出你的第一餐吧！';for(const h of data.history){const row=document.createElement('div');row.className='entry';const t=document.createElement('div');const strong=document.createElement('strong');strong.textContent=`${h.name} · ${h.meal}`;const small=document.createElement('small');small.textContent=new Date(h.time).toLocaleString('zh-TW');t.append(strong,small);const b=document.createElement('button');b.className='btn';b.textContent='刪除';b.onclick=()=>{data.history=data.history.filter(x=>x.id!==h.id);save();render();historyModal()};row.append(t,b);list.append(row)}$('#clearHistory').onclick=()=>{if(!data.history.length){toast('目前沒有可清除的歷史紀錄');return}const btn=$('#clearHistory');btn.disabled=true;const box=document.createElement('div');box.className='entry';box.style.cssText='display:block;background:#fff0d6;border:2px solid #ff735e;border-radius:14px;padding:14px;margin-top:10px';const msg=document.createElement('p');msg.textContent='確定要清除全部 '+data.history.length+' 筆用餐歷史嗎？此操作無法復原。';const actions=document.createElement('div');actions.className='actions';const cancel=document.createElement('button');cancel.className='btn';cancel.textContent='取消';const ok=document.createElement('button');ok.className='btn primary';ok.textContent='確認清除';cancel.onclick=()=>{box.remove();btn.disabled=false;btn.focus()};ok.onclick=()=>{data.history=[];save();render();historyModal();toast('已清除全部用餐歷史')};actions.append(cancel,ok);box.append(msg,actions);btn.after(box);cancel.focus()}}
function customModal(editId=null){const f=data.custom.find(x=>x.id===editId);const body=`<p class="small">新增的料理會加入轉盤，並保存在目前瀏覽器。</p><form id="foodForm" class="form-grid"><label>料理名稱<input name="name" type="text" required maxlength="24" value="${safe((f&&f.name)||'')}"></label><label>料理分類<select name="category">${CATS.map(c=>`<option value="${safe(c)}" ${f&&f.category===c?'selected':''}>${safe(c)}</option>`).join('')}</select></label><label>最低價格（NT$）<input name="min" type="number" min="0" max="100000" required value="${f?f.min:80}"></label><label>最高價格（NT$）<input name="max" type="number" min="0" max="100000" required value="${f?f.max:200}"></label><label>圖示 Emoji<input name="emoji" type="text" maxlength="8" value="${safe((f&&f.emoji)||'🍽️')}"></label><label>食材標籤（逗號分隔）<input name="tags" type="text" value="${safe((f&&Array.isArray(f.tags)&&f.tags.join(','))||'')}"></label><div class="wide"><strong>適合餐別（至少選一項）</strong><div class="chips">${MEALS.map(m=>`<label class="check"><input type="checkbox" name="meal" value="${m}" ${f?f.meals.includes(m)?'checked':'':'checked'}>${m}</label>`).join('')}</div></div><button class="btn primary wide" type="submit">${f?'儲存修改':'新增料理'}</button></form><h3>🥗 我的自訂料理（${data.custom.length}）</h3><div id="customList"></div>`;modal('➕ 自訂料理管理',body);$('#foodForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget;const fd=new FormData(form);const name=String(fd.get('name')||'').trim(),min=Number(fd.get('min')),max=Number(fd.get('max')),meals=fd.getAll('meal');if(!name||!meals.length||!Number.isFinite(min)||!Number.isFinite(max)||min<0||max<min||max>100000){toast('請確認名稱、餐別及價格範圍');return}if(foods().some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==editId)){toast('這道料理已存在');return}const item={id:editId||'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,category:String(fd.get('category')),min,max,emoji:String(fd.get('emoji')||'🍽️').trim()||'🍽️',tags:String(fd.get('tags')||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),meals,query:name};if(editId)data.custom=data.custom.map(x=>x.id===editId?item:x);else data.custom.push(item);save();render();toast(editId?'料理已修改':'料理新增成功');customModal()};const list=$('#customList');if(!data.custom.length)list.textContent='還沒有自訂料理。';for(const x of data.custom){const row=document.createElement('div');row.className='entry';const label=document.createElement('span');label.textContent=`${x.emoji} ${x.name}`;const actions=document.createElement('div');const edit=document.createElement('button');edit.className='btn';edit.textContent='編輯';edit.onclick=()=>customModal(x.id);const del=document.createElement('button');del.className='btn';del.textContent='刪除';del.onclick=()=>{if(confirm(`確定刪除「${x.name}」嗎？`)){data.custom=data.custom.filter(f=>f.id!==x.id);data.excluded=data.excluded.filter(id=>id!==x.id);save();render();customModal()}};actions.append(edit,del);row.append(label,actions);list.append(row)}}
$('#budget').onchange=e=>{if(spinning)return;data.budget=e.target.value;save();render()};$('#avoidRecent').onchange=e=>{if(spinning)return;data.avoidRecent=e.target.checked;save();render()};$('#reduceMotion').onchange=e=>{data.reduceMotion=e.target.checked;save()};$('#area').oninput=e=>{data.area=e.target.value;save();geo=null;$('#locationInfo').textContent='將使用你輸入的地區搜尋。'};$('#spinBtn').onclick=spin;$('#retryBtn').onclick=()=>{closeResult();spin()};$('#closeResult').onclick=closeResult;$('#resultOverlay').addEventListener('click',e=>{if(e.target.id==='resultOverlay')closeResult()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#resultOverlay').classList.contains('hidden'))closeResult()});$('#confirmBtn').onclick=confirmFood;$('#mapsBtn').onclick=maps;$('#excludeBtn').onclick=exclusions;$('#historyBtn').onclick=$('#historyBtn2').onclick=historyModal;$('#customBtn').onclick=$('#customBtn2').onclick=()=>customModal();$('#locateBtn').onclick=()=>{if(!navigator.geolocation){toast('此瀏覽器不支援定位，請手動輸入地區');return}$('#locationInfo').textContent='正在取得位置…';navigator.geolocation.getCurrentPosition(pos=>{geo={lat:pos.coords.latitude,lng:pos.coords.longitude};data.area='';$('#area').value='';save();$('#locationInfo').textContent='📍 已取得位置。搜尋時將嘗試以此位置為中心。';toast('定位成功！')},()=>{$('#locationInfo').textContent='無法取得位置，請手動輸入地區（HTTPS 或 localhost 通常較可靠）。';toast('定位失敗，請改用手動輸入地區')},{timeout:10000,enableHighAccuracy:false})};render();
</script></body></html>
